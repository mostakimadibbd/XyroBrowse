name: Build and publish XyroBrowse installers

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release/*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Universal
            os: macos-latest
            args: --mac dmg zip --universal
          - name: Windows x64
            os: windows-latest
            args: --win nsis --x64
          - name: Linux x64
            os: ubuntu-latest
            args: --linux AppImage deb --x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --include=dev

      - name: Run tests
        run: npm test

      - name: Build web interface
        run: npm run build

      - name: Compile Electron main and preload
        run: npm run build:electron

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libnss3-dev libatk-bridge2.0-0 libgtk-3-0 libxss1 libasound2t64

      - name: Package installers
        run: npx electron-builder ${{ matrix.args }} --publish never

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xyrobrowse-${{ matrix.name }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  android:
    name: Package Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --include=dev

      - name: Build web app
        run: npm run build

      - name: Generate Android project
        run: npx cap add android || true

      - name: Sync Android project
        run: npx cap sync android

      - name: Build installable Android APK
        run: |
          if [ -d "android" ]; then
            cd android && ./gradlew assembleDebug || true
          fi

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xyrobrowse-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: [package]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || 'v0.1.0' }}
          generate_release_notes: true
          prerelease: false
          fail_on_unmatched_files: false
          files: release-assets/*
