<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>XyroBrowse</title>
    <meta name="description" content="Authentic Google Chrome-styled web browser shell with multi-engine search, reader mode, real shields, and tab management." />
    <meta property="og:title" content="XyroBrowse" />
    <meta property="og:description" content="Authentic Google Chrome-styled web browser shell with multi-engine search, reader mode, real shields, and tab management." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      (function() {
        // Prevent benign HMR/WebSocket connection errors in preview iframe from bubbling
        function isViteHmrError(msg, stack, filename) {
          var s = ((msg || '') + ' ' + (stack || '') + ' ' + (filename || '')).toLowerCase();
          return s.indexOf('@vite/client') !== -1 ||
                 s.indexOf('vite-hmr') !== -1 ||
                 s.indexOf('websocket') !== -1 ||
                 s.indexOf('closed without opened') !== -1;
        }

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var msg = (reason && (reason.message || String(reason))) || '';
          var stack = (reason && reason.stack) || '';
          if (isViteHmrError(msg, stack, '')) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          var msg = event.message || '';
          var filename = event.filename || '';
          var stack = (event.error && event.error.stack) || '';
          if (isViteHmrError(msg, stack, filename)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
